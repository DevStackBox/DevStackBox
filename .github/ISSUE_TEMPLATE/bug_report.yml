name: Bug report
description: Something is broken in DevStackBox
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: DevStackBox version
      placeholder: e.g. 0.1.11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
